<html lang="en">
<head>

<title>QuizForge · Software Interview Prep</title>
<style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1220;--cd:#181c30;--tx:#e8eaf6;--mu:#9aa3c0;--ac:#818cf8;--bo:#2a3050;color-scheme:dark}}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx)}
.w{max-width:760px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}nav{display:flex;gap:8px}
.logo{font-size:1.3rem;font-weight:800;background:none;border:none;color:var(--ac)}
.card{background:var(--cd);border:1px solid var(--bo);border-radius:16px;padding:20px}
h1,h2{margin:.4em 0}.m{color:var(--mu)}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--cd);border:1px solid var(--bo);border-radius:10px;padding:8px 12px}
button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}

textarea{width:100%;font-family:monospace;margin:8px 0}
.row{display:flex;align-items:center;gap:8px}.b{justify-content:space-between}
.pg{height:8px;background:var(--bo);border-radius:99px;overflow:hidden;margin:10px 0}.pg i{display:block;height:100%;background:var(--ac)}
.opts{display:grid;gap:10px;margin:14px 0}.opt{text-align:left;padding:14px}
.opt.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.opt.bad{background:var(--bd);color:#fff;border-color:var(--bd)}
kbd{background:var(--bo);border-radius:6px;padding:1px 7px;margin-right:6px}
.fb{padding:12px;border-radius:12px;border:2px solid;margin:10px 0}.fb.ok{border-color:var(--ok)}.fb.bad{border-color:var(--bd)}
.score{font-size:4rem;font-weight:800;color:var(--ac);margin:0}
.rv{list-style:none;padding:0}.rv li{border-left:5px solid;padding:8px 12px;margin:10px 0;background:var(--bg);border-radius:8px}.rv .ok{border-color:var(--ok)}.rv .bad{border-color:var(--bd)}
.br{display:grid;grid-template-columns:120px 1fr 44px;gap:8px;align-items:center;margin:6px 0}.bar{height:14px;background:var(--bo);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.hm{display:grid;grid-template-rows:repeat(7,14px);grid-auto-flow:column;grid-auto-columns:14px;gap:3px;overflow-x:auto;padding-bottom:6px}.hm i{border-radius:3px;background:var(--bo)}.hm i.on{background:var(--ok)}
.bdg{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}.bdg div{display:flex;flex-direction:column;padding:10px;border:1px dashed var(--bo);border-radius:12px;opacity:.55}.bdg div.on{opacity:1;border:1px solid var(--ac)}.bdg span{font-size:1.6rem}.bdg small{color:var(--mu)}

footer{text-align:center;color:var(--mu);font-size:.8rem;margin:16px 0}.lo{color:var(--bd)}svg{width:100%;background:var(--bg);border-radius:12px}
@media(max-width:560px){.g2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="w">
<header><button class="logo" onclick="home()">⚒ QuizForge</button>

const Q=R.map((r,i)=>({id:'q'+i,c:r[0],d:r[1],q:r[2],o:r[3],a:r[4],e:r[5]}));
const allQ=()=>Q.concat(D.custom.flatMap(c=>c.qs));

/* ---------- helpers ---------- */
const dk=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function rng(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19}let a=h>>>0;return()=>{a|=0;a=a+0x6d2b79f5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function sh(arr,seed){const r=rng(String(seed??Math.random())),a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function streak(){const d=new Date();if(!D.daily[dk(d)])d.setDate(d.getDate()-1);let n=0;while(D.daily[dk(d)]){n++;d.setDate(d.getDate()-1)}return n}
const due=()=>D.deck.filter(c=>c.due<=Date.now());
function addMis(id){D.deck=D.deck.filter(c=>c.id!==id).concat({id,st:0,due:Date.now()+IV[0]*DAY})}
function rev(id,ok){const c=D.deck.find(x=>x.id===id);if(!c)return 0;D.deck=D.deck.filter(x=>x.id!==id);if(!ok){D.deck.push({id,st:0,due:Date.now()+IV[0]*DAY});return 0}const st=c.st+1;if(st>=IV.length)return 1;D.deck.push({id,st,due:Date.now()+IV[st]*DAY});return 0}
function toast(t){const d=document.createElement('div');d.textContent=t;$('#toast').append(d);setTimeout(()=>d.remove(),4000)}

/* ---------- home ---------- */
let H={mode:'solo',cat:'Mixed',diff:'adaptive',n:2,names:['','','','']},S=null,tick=null;
function stop(){clearInterval(tick);tick=null}
function home(){stop();S=null;const m=[['solo','Solo'],['daily','Daily Challenge'],['pass','Pass-and-Play'],['review','Review Mistakes ('+due().length+' due)']];
$('#app').innerHTML=`<section class="card"><h1>Ace your software interview</h1><p class="m">🔥 Daily streak: <b>${streak()}</b></p>
<div class="ch">${m.map(x=>`<button class="chip${H.mode==x[0]?' on':''}" aria-pressed="${H.mode==x[0]}" onclick="H.mode='${x[0]}';home()">${x[1]}</button>`).join('')}</div>
${H.mode=='solo'||H.mode=='pass'?`<div class="g2"><label>Category<select onchange="H.cat=this.value">${['Mixed',...CATS].map(c=>`<option${H.cat==c?' selected':''}>${c}</option>`).join('')}</select></label>
<label>Difficulty<select onchange="H.diff=this.value">${['adaptive','easy','medium','hard'].map(c=>`<option value="${c}"${H.diff==c?' selected':''}>${c[0].toUpperCase()+c.slice(1)}</option>`).join('')}</select></label></div>`:''}
${H.mode=='pass'?`<label>Players<select onchange="H.n=+this.value;home()">${[2,3,4].map(n=>`<option${H.n==n?' selected':''}>${n}</option>`).join('')}</select></label>
<div class="g2">${Array.from({length:H.n},(_,i)=>`<input placeholder="Player ${i+1} name" aria-label="Player ${i+1} name" value="${esc(H.names[i])}" oninput="H.names[${i}]=this.value">`).join('')}</div>`:''}
<button class="pri big" onclick="launch(H.mode)">Start ▶</button></section>`}

/* ---------- quiz ---------- */
function launch(mode,quiz){let c;
if(mode=='daily'){const p=sh(Q,dk()).slice(0,5);c={title:'Daily Challenge',mode,pool:p,n:5,ad:0,pl:['You']}}
else if(mode=='review'){const p=due().map(x=>allQ().find(q=>q.id==x.id)).filter(Boolean);c={title:'Review Mistakes',mode,pool:p,n:p.length,ad:0,pl:['You']}}
else if(mode=='custom'){const p=sh(quiz.qs);c={title:quiz.name,mode,pool:p,n:Math.min(10,p.length),ad:0,pl:['You']}}
else{let b=sh(H.cat=='Mixed'?Q:Q.filter(q=>q.c==H.cat)),ad=H.diff=='adaptive';
const p=ad?b:b.filter(q=>q.d==H.diff).concat(b.filter(q=>q.d!=H.diff));
const pl=mode=='pass'?H.names.slice(0,H.n).map((s,i)=>s.trim()||'Player '+(i+1)):['You'];
c={title:mode=='pass'?'Pass-and-Play':H.cat+' quiz',mode,pool:p,n:Math.min(p.length,mode=='pass'?pl.length*3:10),ad,pl}}
if(!c.pool.length){alert(mode=='review'?'No mistakes are due for review yet 🎉':'No questions available.');return}
S={cfg:c,used:[],ad:{l:'medium',r:0,w:0},hard:0,conf:null,sel:null,hid:[],pu:{},log:[],sc:c.pl.map(()=>0),left:20,last:{mode,quiz}};
S.q=pick();S.used.push(S.q.id);S.pu={};nq();}
function pick(){const s=S,av=s.cfg.pool.filter(x=>!s.used.includes(x.id));if(!av.length)return null;if(!s.cfg.ad)return av[0];const m=av.filter(x=>x.d==s.ad.l),a=m.length?m:av;return a[Math.floor(Math.random()*a.length)]}
function nq(){stop();S.conf='medium';S.sel=null;S.hid=[];S.left=20;rQ();tick=setInterval(()=>{if(S.sel!==null)return;S.left--;tm();if(S.left<=0)ans(-1)},1000)}
function tm(){const e=$('#tm');if(e){e.textContent='⏱ '+Math.max(S.left,0)+'s';e.className=S.left<=5?'lo':''}}
function rQ(){const s=S,q=s.q,c=s.cfg,p=(s.sel===null?s.log.length:s.log.length-1)%c.pl.length,l=s.log[s.log.length-1],used=s.pu;
$('#app').innerHTML=`<main class="card"><div class="row b"><button class="g" onclick="home()">✕ Exit</button><b>${esc(c.title)}</b><b id="tm"></b></div>
<div class="pg" role="progressbar" aria-valuemin="0" aria-valuemax="${c.n}" aria-valuenow="${s.log.length}"><i style="width:${s.log.length/c.n*100}%"></i></div>
${c.pl.length>1?`<p>🎮 <b>${esc(c.pl[p])}</b>’s turn · ${c.pl.map((n,i)=>esc(n)+': '+s.sc[i]).join(' · ')}</p>`:''}
<p class="m">Question ${Math.min(s.log.length+(s.sel===null?1:0),c.n)} of ${c.n} · ${esc(q.c)} · ${q.d}${c.ad?' · level: '+s.ad.l:''}</p>
<h2>${esc(q.q)}</h2><button class="g" onclick="speak()">🔊 Read aloud</button>
${s.sel===null?`<div class="ch" role="group" aria-label="Confidence"><span class="m">Confidence:</span>${Object.keys(CF).map(k=>`<button class="chip${s.conf==k?' on':''}" aria-pressed="${s.conf==k}" onclick="setC('${k}')">${CF[k][0]} (+${CF[k][1]} / ${CF[k][2]})</button>`).join('')}</div>`:''}
<div class="opts">${q.o.map((o,i)=>s.hid.includes(i)?'':`<button class="opt${s.sel!==null?(i==q.a?' ok':i==s.sel?' bad':''):''}"${s.sel!==null||!s.conf?' disabled':''} onclick="ans(${i})"><kbd>${i+1}</kbd>${esc(o)}</button>`).join('')}</div>
${s.sel===null&&!s.conf?'<p class="m">👆 Pick a confidence level to unlock the answers.</p>':''}
${s.sel!==null&&l?`<div class="fb ${l.ok?'ok':'bad'}" role="status"><b>${s.sel==-1?'⏰ Time’s up! ':l.ok?'✅ Correct! ':'❌ Wrong. '}${l.pts>=0?'+':''}${l.pts} pts</b><p>${esc(q.e)}</p><button class="pri" onclick="nxt()">${s.log.length>=c.n?'See results':'Next (N)'} →</button></div>`:''}
<div class="ch"><button class="chip" ${used.f||s.sel!==null?'disabled':''} onclick="fifty()">✂️ 50/50</button><button class="chip" ${used.z||s.sel!==null?'disabled':''} onclick="freeze()">❄️ +15s</button><button class="chip" ${used.s||s.sel!==null?'disabled':''} onclick="skip()">⏭ Skip</button></div></main>`;tm()}
function setC(k){S.conf=k;rQ()}
function ans(i){const s=S;if(!s||s.sel!==null)return;if(i!=-1&&!s.conf)return;const c=s.conf||'low',ok=i==s.q.a,pts=ok?CF[c][1]:CF[c][2],p=s.log.length%s.cfg.pl.length;
s.sc[p]+=pts;s.log.push({q:s.q,pick:i,ok,pts,conf:c,time:20-Math.max(s.left,0)});
const a=s.ad;if(ok){a.r++;a.w=0}else{a.w++;a.r=0}let x=LV.indexOf(a.l);if(a.r>=3){x=Math.min(2,x+1);a.r=0}if(a.w>=2){x=Math.max(0,x-1);a.w=0}a.l=LV[x];if(a.l=='hard')s.hard=1;
s.sel=i;stop();rQ()}
function nxt(){const s=S;if(!s||s.sel===null)return;const q=s.log.length>=s.cfg.n?null:pick();if(!q)return fin();s.q=q;s.used.push(q.id);nq()}
function fifty(){if(S.pu.f||S.sel!==null)return;S.hid=sh([0,1,2,3].filter(i=>i!=S.q.a)).slice(0,2);S.pu.f=1;rQ()}
function freeze(){if(S.pu.z||S.sel!==null)return;S.left+=15;S.pu.z=1;rQ()}
function skip(){if(S.pu.s||S.sel!==null)return;const q=pick();if(!q)return;S.q=q;S.used.push(q.id);S.pu.s=1;S.conf='medium';S.hid=[];S.left=20;rQ()}
function speak(){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(S.q.q+'. '+S.q.o.map((o,i)=>'Option '+(i+1)+': '+o).join('. ')))}
addEventListener('keydown',e=>{if(!S||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||!$('#tm'))return;const n=+e.key;if(n>=1&&n<=4&&!S.hid.includes(n-1))ans(n-1);if(e.key=='n'||e.key=='N')nxt()});

/* ---------- finish / results ---------- */
const BD=[['first','🏆','First Win','Finish a quiz with 60%+ accuracy',x=>x.t&&x.acc>=.6],['perfect','💯','Perfect Score','100% on 5+ questions',x=>x.t>=5&&x.acc==1],
['fear','🎲','Fearless Bettor','3 correct High-confidence answers in a quiz',x=>x.log.filter(l=>l.conf=='high'&&l.ok).length>=3],
['comeback','🔥','Comeback','Miss the first two, still finish 60%+',x=>x.t>=5&&!x.log[0].ok&&!x.log[1].ok&&x.acc>=.6],
['str5','📅','5-Day Streak','Daily Challenge 5 days in a row',()=>streak()>=5],['fast','⚡','Speedster','Under 5s average (5+ questions)',x=>x.t>=5&&x.avg<5],
['scholar','🎓','Scholar','50 correct answers total',()=>D.ct>=50],['ace','🚀','Adaptive Ace','Reach Hard in Adaptive mode',x=>x.hard&&x.ad],
['mm','🧠','Mistake Master','Master a Mistake Deck card',x=>x.cleared>0],['party','🤝','Party Time','Finish Pass-and-Play',x=>x.pl>1]];
function fin(){stop();const s=S,log=s.log,t=log.length,ok=log.filter(l=>l.ok).length,acc=t?ok/t:0,avg=t?log.reduce((a,l)=>a+l.time,0)/t:0;let cleared=0;
for(const l of log){if(s.cfg.mode=='review')cleared+=rev(l.q.id,l.ok);else if(!l.ok)addMis(l.q.id)}
for(const l of log){const o=D.cat[l.q.c]||[0,0];D.cat[l.q.c]=[o[0]+(l.ok?1:0),o[1]+1]}
D.ct+=ok;if(s.cfg.mode=='daily')D.daily[dk()]=1;D.hist.push({s:s.sc.reduce((a,b)=>a+b,0),ok,t});D.hist=D.hist.slice(-100);
const x={t,acc,avg,log,cleared,hard:s.hard,ad:s.cfg.ad,pl:s.cfg.pl.length};
BD.forEach(b=>{if(!D.badges.includes(b[0])&&b[4](x)){D.badges.push(b[0]);toast(b[1]+' Unlocked: '+b[2])}});save();
const rk=s.cfg.pl.map((n,i)=>({n,s:s.sc[i]})).sort((a,b)=>b.s-a.s),multi=s.cfg.pl.length>1;
$('#app').innerHTML=`<section class="card"><h1>${multi?'🏁 '+esc(rk[0].n)+' wins!':'Results'}</h1>
${multi?`<ol>${rk.map(r=>`<li>${esc(r.n)} — <b>${r.s}</b> pts</li>`).join('')}</ol>`:`<p class="score">${rk[0].s} <small class="m" style="font-size:1.2rem">pts</small></p>`}
<p>${ok}/${t} correct · ${Math.round(acc*100)}% accuracy · avg ${avg.toFixed(1)}s per question</p>
<div class="ch"><button class="pri" onclick="launch(S.last.mode,S.last.quiz)">Play again</button><button onclick="card(${rk[0].s},${acc},${ok},${t})">🖼 Make result card</button><button onclick="home()">Home</button></div><div id="card"></div>
<h2>Review</h2><ul class="rv">${log.map((l,i)=>`<li class="${l.ok?'ok':'bad'}"><b>${i+1}. ${esc(l.q.q)}</b><div>Your answer: ${l.pick==-1?'— (time out)':esc(l.q.o[l.pick])} · Correct: ${esc(l.q.o[l.q.a])} · ${l.pts>=0?'+':''}${l.pts} (${l.conf})</div><div class="m">${esc(l.q.e)}</div></li>`).join('')}</ul></section>`}
function card(sc,acc,ok,t){const c=document.createElement('canvas');c.width=800;c.height=420;const x=c.getContext('2d'),g=x.createLinearGradient(0,0,800,420);g.addColorStop(0,'#4f46e5');g.addColorStop(1,'#9333ea');x.fillStyle=g;x.fillRect(0,0,800,420);x.fillStyle='#fff';x.textAlign='center';
x.font='bold 36px system-ui,sans-serif';x.fillText('QuizForge',400,70);x.font='24px system-ui,sans-serif';x.fillText(S.cfg.title,400,110);x.font='bold 110px system-ui,sans-serif';x.fillText(String(sc),400,250);x.font='26px system-ui,sans-serif';x.fillText('points',400,290);x.font='28px system-ui,sans-serif';x.fillText(ok+'/'+t+' correct · '+Math.round(acc*100)+'% accuracy',400,355);
$('#card').innerHTML='<p class="m">Right-click (or long-press) the image to save it as a PNG.</p><img alt="Result card" style="max-width:100%;border-radius:12px" src="'+c.toDataURL('image/png')+'">'}

/* ---------- stats ---------- */
function stats(){stop();S=null;const cats=Object.entries(D.cat),h=D.hist.slice(-20),sc=h.map(x=>x.s),mn=Math.min(0,...sc),mx=Math.max(1,...sc),W=400,Ht=140;
const pts=sc.map((v,i)=>(sc.length>1?i/(sc.length-1)*W:W/2)+','+(Ht-(v-mn)/(mx-mn)*(Ht-10)-5)).join(' ');
const e=new Date(),tot=14*7+e.getDay()+1,st=new Date(e);st.setDate(e.getDate()-(tot-1));let hm='';for(let i=0;i<tot;i++){const d=new Date(st);d.setDate(st.getDate()+i);const k=dk(d);hm+=`<i class="${D.daily[k]?'on':''}" title="${k}"></i>`}
$('#app').innerHTML=`<section class="card"><h1>📊 Your stats</h1><p>Quizzes: <b>${D.hist.length}</b> · Correct: <b>${D.ct}</b> · 🔥 Streak: <b>${streak()}</b> · Mistake deck: <b>${D.deck.length}</b></p>
<h2>Accuracy by category</h2>${cats.length?cats.map(([c,v])=>{const p=Math.round(v[0]/v[1]*100);return`<div class="br"><span>${esc(c)}</span><div class="bar"><i style="width:${p}%"></i></div><span>${p}%</span></div>`}).join(''):'<p class="m">Play a quiz to see data.</p>'}
<h2>Score over time</h2>${sc.length?`<svg viewBox="0 0 ${W} ${Ht}" role="img" aria-label="Score over time"><polyline points="${pts}" fill="none" stroke="var(--ac)" stroke-width="3"/></svg>`:'<p class="m">No games yet.</p>'}
<h2>Daily Challenge calendar</h2><div class="hm" role="img" aria-label="Daily challenge streak calendar">${hm}</div>
<h2>Achievements</h2><div class="bdg">${BD.map(b=>{const on=D.badges.includes(b[0]);return`<div class="${on?'on':''}"><span>${on?b[1]:'🔒'}</span><b>${b[2]}</b><small>${b[3]}</small></div>`}).join('')}</div></section>`}

/* ---------- custom quizzes ---------- */
function csv(t){const r=[];let w=[],c='',q=0;for(let i=0;i<t.length;i++){const h=t[i];if(q){if(h=='"'){if(t[i+1]=='"'){c+='"';i++}else q=0}else c+=h}else if(h=='"')q=1;else if(h==',')w.push(c),c='';else if(h=='\n'||h=='\r'){if(h=='\r'&&t[i+1]=='\n')i++;w.push(c);r.push(w);w=[];c=''}else c+=h}if(c||w.length){w.push(c);r.push(w)}return r.filter(x=>x.some(y=>y.trim()))}
function parse(t){t=t.trim();const errs=[],qs=[];if(!t)return{qs,errs:['Paste JSON or CSV first.']};let raw;
if(t[0]=='['||t[0]=='{'){try{const p=JSON.parse(t);raw=Array.isArray(p)?p:p.questions;if(!Array.isArray(raw))return{qs,errs:['JSON must be an array of questions.']}}catch(e){return{qs,errs:['Invalid JSON: '+e.message]}}}
else{const rows=csv(t);if(rows.length&&rows[0][0].trim().toLowerCase()=='question')rows.shift();raw=rows.map(r=>({question:r[0],options:r.slice(1,5),answerIndex:Number(r[5])-1,explanation:r[6]||''}))}
raw.forEach((q,i)=>{const n='Question '+(i+1)+': ';if(!q||typeof q.question!='string'||!q.question.trim())return errs.push(n+'missing question text.');
if(!Array.isArray(q.options)||q.options.length!=4||q.options.some(o=>typeof o!='string'||!o.trim()))return errs.push(n+'needs exactly 4 non-empty options.');
if(!Number.isInteger(q.answerIndex)||q.answerIndex<0||q.answerIndex>3)return errs.push(n+'answer must be option 1–4 (answerIndex 0–3).');
qs.push({id:'c'+Date.now()+'_'+i,c:'Custom',d:LV.includes(q.difficulty)?q.difficulty:'medium',q:q.question.trim(),o:q.options.map(o=>o.trim()),a:q.answerIndex,e:q.explanation||''})});
if(!qs.length&&!errs.length)errs.push('No questions found.');return{qs,errs}}
function cust(msg){stop();S=null;$('#app').innerHTML=`<section class="card"><h1>🛠 Custom quizzes</h1><p class="m">Paste JSON (<code>[{"question","options":[4],"answerIndex":0-3,"explanation"}]</code>) or CSV (question, A, B, C, D, answer 1–4, explanation).</p>
<input id="cn" placeholder="Quiz name" aria-label="Quiz name"><textarea id="ct" rows="8" aria-label="Quiz data"></textarea>
<div class="ch"><input type="file" id="cf" accept=".json,.csv,.txt" aria-label="Upload quiz file"><button class="pri" onclick="saveQ()">Validate &amp; save</button></div>
<ul class="err" id="ce" role="alert">${(msg||[]).map(m=>`<li>${esc(m)}</li>`).join('')}</ul><div id="ex"></div>
<h2>Saved quizzes</h2>${D.custom.length?D.custom.map((z,i)=>`<div class="row b sv"><span>${esc(z.name)} <small class="m">(${z.qs.length} questions)</small></span><span class="ch"><button class="pri" onclick="launch('custom',D.custom[${i}])">Play</button><button onclick="expQ(${i})">Export JSON</button><button onclick="D.custom.splice(${i},1);save();cust()">Delete</button></span></div>`).join(''):'<p class="m">None yet.</p>'}</section>`;
$('#cf').onchange=e=>{const f=e.target.files[0];if(f)f.text().then(t=>$('#ct').value=t)}}
function saveQ(){const r=parse($('#ct').value);if(r.errs.length)return cust(r.errs);D.custom.push({name:$('#cn').value.trim()||'My quiz',qs:r.qs});save();cust()}
function expQ(i){const z=D.custom[i],j=JSON.stringify(z.qs.map(q=>({question:q.q,options:q.o,answerIndex:q.a,explanation:q.e,difficulty:q.d})),null,2);$('#ex').innerHTML='<p class="m">Copy this JSON to share or back up your quiz:</p><textarea rows="8" readonly>'+esc(j)+'</textarea>';$('#ex textarea').select()}
home();
</script>
</body>
</html>
